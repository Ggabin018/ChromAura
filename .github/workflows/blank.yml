  build:
    name: Build ${{ matrix.platform }}
    runs-on: ubuntu-latest
    # needs: test

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            preset: Windows Desktop
            output: release/Windows/ChromAura.exe

          - platform: Linux
            preset: Linux
            output: release/Linux/ChromAura.x86_64

          - platform: Mac
            preset: macOS
            output: release/MacOS/ChromAura.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: true
          include-templates: true
  
      - name: Check environment
        run: |
          godot --version
          dotnet --version

      - name: Import project
        run: |
          godot --headless --editor --quit

      - name: Create build directory
        run: |
          mkdir -p "$(dirname '${{ matrix.output }}')"

      - name: Export
        run: |
          godot --headless --export-release "${{ matrix.preset }}" "${{ matrix.output }}"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: build/${{ matrix.platform == 'Windows' && 'windows' || 'linux' }}/
