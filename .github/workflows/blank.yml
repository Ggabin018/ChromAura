name: CI

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          include-export-templates: false

      - name: Import project
        run: |
          godot --headless --editor --quit

      - name: Validate GDScript
        run: |
          godot --headless --editor --quit --check-only

      - name: Run unit tests
        run: |
          godot --headless \
            -s addons/gut/gut_cmdln.gd \
            -gdir=res://tests \
            -gexit

  build:
    name: Build ${{ matrix.platform }}
    runs-on: ubuntu-latest
    needs: test

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            preset: Windows Desktop
            output: build/windows/game.exe

          - platform: Linux
            preset: Linux
            output: build/linux/game.x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          include-export-templates: true

      - name: Import project
        run: |
          godot --headless --editor --quit

      - name: Create build directory
        run: |
          mkdir -p "$(dirname '${{ matrix.output }}')"

      - name: Export
        run: |
          godot --headless \
            --export-release \
            "${{ matrix.preset }}" \
            "${{ matrix.output }}"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: build/${{ matrix.platform == 'Windows' && 'windows' || 'linux' }}/
