<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- Radial gradient for depth effect -->
    <radialGradient id="depthGradient" cx="50%" cy="30%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#2d3a4a"/>
      <stop offset="50%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </radialGradient>
  </defs>
  
  <!-- Background with depth gradient -->
  <rect x="2" y="2" width="124" height="124" rx="14" fill="url(#depthGradient)" stroke="#16213e" stroke-width="4"/>
  
  <!-- Depth camera body -->
  <rect x="16" y="42" width="96" height="44" rx="8" fill="#2d3a4a"/>
  <rect x="20" y="46" width="88" height="36" rx="5" fill="#1f2833"/>
  
  <!-- RGB camera lens (left) -->
  <circle cx="42" cy="64" r="14" fill="#3a4a5a"/>
  <circle cx="42" cy="64" r="10" fill="#0f4c75"/>
  <circle cx="42" cy="64" r="6" fill="#3282b8"/>
  <circle cx="40" cy="62" r="2" fill="#bbe1fa" opacity="0.7"/>
  
  <!-- IR emitter (center) - with glow -->
  <circle cx="64" cy="64" r="8" fill="#4a1942"/>
  <circle cx="64" cy="64" r="5" fill="#7b2cbf"/>
  <circle cx="64" cy="64" r="3" fill="#c77dff"/>
  
  <!-- Depth sensor (right) -->
  <circle cx="86" cy="64" r="14" fill="#3a4a5a"/>
  <circle cx="86" cy="64" r="10" fill="#1b4332"/>
  <circle cx="86" cy="64" r="6" fill="#2d6a4f"/>
  <circle cx="84" cy="62" r="2" fill="#95d5b2" opacity="0.7"/>
  
  <!-- Depth waves emanating from sensor -->
  <g fill="none" stroke="#7b2cbf" stroke-width="1.5" opacity="0.6">
    <path d="M64 38 Q74 28 84 38" />
    <path d="M64 32 Q74 18 84 32" />
    <path d="M64 26 Q74 8 84 26" />
  </g>
  
  <!-- Status LED -->
  <circle cx="104" cy="52" r="3" fill="#40916c"/>
  
  <!-- Stand/Mount -->
  <path d="M54 86 L74 86 L70 100 L58 100 Z" fill="#2d3a4a"/>
  <rect x="52" y="100" width="24" height="6" rx="2" fill="#1f2833"/>
</svg>
